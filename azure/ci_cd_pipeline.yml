# Azure Pipelines CI/CD Configuration (Phase 1 — validation only, no apply)

trigger:
  - main
  - develop

pr:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'
  azureResourceGroup: 'improve-yourself-rg'
  azureLocation: 'westeurope'

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-azure.txt
              pip install pytest pytest-cov pylint
            displayName: 'Install dependencies'

          - script: |
              pylint services/ config/ azure/
            displayName: 'Run linting'
            continueOnError: true

          - script: |
              pytest tests/ -v --cov=services --cov=config --cov-report=xml
            displayName: 'Run tests with coverage'

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
            displayName: 'Publish code coverage'

          # Validate Bicep syntax early (runs in pipeline)
          - task: AzureCLI@2
            displayName: 'Validate Bicep syntax'
            inputs:
              azureSubscription: 'improve-yourself-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az bicep version
                az bicep build --file azure/deployment.bicep --stdout >/dev/null

  - stage: IaC_Validate
    displayName: 'IaC Validation (what-if when secret provided)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: WhatIf
        displayName: 'Bicep what-if (no apply)'
        steps:
          - task: AzureCLI@2
            displayName: 'What-if (skips if SQL_ADMIN_PASSWORD not set)'
            inputs:
              azureSubscription: 'improve-yourself-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                if [ -z "${SQL_ADMIN_PASSWORD:-}" ]; then
                  echo "No SQL_ADMIN_PASSWORD provided. Skipping what-if to avoid exposing/guessing secret values."
                  exit 0
                fi
                DEPLOY_NAME="dryrun-$(Build.BuildNumber)"
                PARAMS=(
                  -p environment=dev
                  -p appName=improve-yourself
                  -p sqlAdminUser=app_sql_admin
                  -p sqlAdminPassword="$SQL_ADMIN_PASSWORD"
                )
                az deployment group what-if \
                  -g "$(azureResourceGroup)" \
                  -n "$DEPLOY_NAME" \
                  -f "$(Build.SourcesDirectory)/azure/deployment.bicep" \
                  "${PARAMS[@]}" \
                  --no-pretty-print
            env:
              SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)

  - stage: SecurityScan
    displayName: 'Security Scan Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SecurityScanning
        displayName: 'Security and Compliance'
        steps:
          - script: |
              pip install bandit safety
              bandit -r services/ config/ azure/ -f json -o bandit-report.json || true
              safety check --json > safety-report.json || true
            displayName: 'Run security checks'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'security-reports'
            displayName: 'Publish security reports'
            condition: always()
