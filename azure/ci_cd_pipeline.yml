# Azure Pipelines CI/CD Configuration (Phase 2 — validation and what-if only, no apply)

trigger:
  - main
  - develop

pr:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'
  azureResourceGroup: 'improve-yourself-rg'
  azureLocation: 'westeurope'
  phase2ParametersFile: 'azure/parameters/dev.phase2.json'

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-azure.txt
              pip install pytest pytest-cov pylint
            displayName: 'Install dependencies'

          - script: |
              pylint services/ config/ azure/
            displayName: 'Run linting'
            continueOnError: true

          - script: |
              pytest tests/ -v --cov=services --cov=config --cov-report=xml
            displayName: 'Run tests with coverage'

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
            displayName: 'Publish code coverage'

          - script: |
              set -euo pipefail
              python azure/validate_phase2_config.py \
                --parameters "$(phase2ParametersFile)" \
                --bicep azure/deployment.bicep
            displayName: 'Validate Phase 2 parameters and Bicep contracts'

          # Bicep build runs in CI only; it does not deploy resources.
          - task: AzureCLI@2
            displayName: 'Build and validate Bicep syntax'
            inputs:
              azureSubscription: 'improve-yourself-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az bicep version
                az bicep build --file azure/deployment.bicep --stdout >/dev/null

  - stage: IaC_Validate
    displayName: 'Phase 2 IaC what-if (no apply)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: WhatIf
        displayName: 'Bicep what-if using dev.phase2 parameters'
        steps:
          - task: AzureCLI@2
            displayName: 'What-if (skips if SQL_ADMIN_PASSWORD not set)'
            inputs:
              azureSubscription: 'improve-yourself-subscription'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                set +x
                PARAMETER_FILE="$(Build.SourcesDirectory)/$(phase2ParametersFile)"
                python azure/validate_phase2_config.py \
                  --parameters "$PARAMETER_FILE" \
                  --bicep azure/deployment.bicep
                if [ -z "${SQL_ADMIN_PASSWORD:-}" ]; then
                  echo "No SQL_ADMIN_PASSWORD provided. Parameters were validated; skipping Azure what-if."
                  exit 0
                fi
                DEPLOY_NAME="dryrun-$(Build.BuildNumber)"
                az deployment group what-if \
                  --resource-group "$(azureResourceGroup)" \
                  --name "$DEPLOY_NAME" \
                  --template-file "$(Build.SourcesDirectory)/azure/deployment.bicep" \
                  --parameters "@$PARAMETER_FILE" "sqlAdminPassword=$SQL_ADMIN_PASSWORD" \
                  --no-pretty-print
            env:
              SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)

  - stage: SecurityScan
    displayName: 'Security Scan Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SecurityScanning
        displayName: 'Security and Compliance'
        steps:
          - script: |
              pip install bandit safety
              bandit -r services/ config/ azure/ -f json -o bandit-report.json || true
              safety check --json > safety-report.json || true
            displayName: 'Run security checks'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'security-reports'
            displayName: 'Publish security reports'
            condition: always()
