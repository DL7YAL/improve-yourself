name: V1 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Python 3.13 baseline
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify Python launcher
        shell: pwsh
        run: |
          py -3.13 --version

      - name: Run reproducible V1 baseline
        shell: pwsh
        run: |
          ./tools/dev/Setup-V1.ps1

      - name: Verify clean worktree
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Host $changes
            throw 'CI baseline modified the tracked worktree.'
          }
