[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "improve-yourself-analyzer"
version = "0.1.0"
description = "Local-first CS2 demo analysis foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "awpy==2.0.2",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
iy-analyze = "improve_yourself.cli:main"
iy-replay-viewer = "improve_yourself.viewer:main"
iy-system-check = "improve_yourself.system_check:main"
iy-optimizer-input = "improve_yourself.optimizer_input:main"
iy-system-check-review = "improve_yourself.system_review:main"
iy-workflow = "improve_yourself.workflow:main"
iy-review-server = "improve_yourself.review_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/improve_yourself"]
